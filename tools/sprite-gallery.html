<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Gallery</title>
<!-- Dev-only page (M8): every monster and character sprite at once, in monsters.json order.
     Open http://localhost:5173/tools/sprite-gallery.html while `npm run dev` runs. Not part of the build. -->
<style>
  body { margin: 8px; background: #1d1a2e; color: #fff; font-family: system-ui, sans-serif; }
  h1 { font-size: 1.1rem; margin: 4px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
  figure { margin: 0; background: #d9f0c8; border-radius: 6px; padding: 4px; color: #222; }
  figure.missing { background: #f3d6d6; }
  img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
  figcaption { font-size: 11px; }
</style>
</head>
<body>
<h1>Monsters (pink = no sprite yet, the game draws its look data instead)</h1>
<div class="grid" id="monsters"></div>
<h1>Characters</h1>
<div class="grid" id="characters"></div>
<script type="module">
  const sprites = import.meta.glob('../src/assets/sprites/*/*.svg', { query: '?url', import: 'default', eager: true });
  const url = (dir, id) => sprites[`../src/assets/sprites/${dir}/${id}.svg`];
  const card = (src, label) => {
    const f = document.createElement('figure');
    if (src) f.innerHTML = `<img src="${src}" alt="${label}">`;
    else f.className = 'missing';
    f.insertAdjacentHTML('beforeend', `<figcaption>${label}</figcaption>`);
    return f;
  };
  const { default: monsters } = await import('../src/data/monsters.json');
  for (const m of monsters) document.getElementById('monsters').append(card(url('monsters', m.id), `${m.name} (${m.scale}x)`));
  for (const id of ['player', 'player-map', 'papai', 'papai-map']) document.getElementById('characters').append(card(url('characters', id), id));
</script>
</body>
</html>
