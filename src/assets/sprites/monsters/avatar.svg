      <g fill="#7cc4f2" stroke="#2a6fa8" stroke-width="1"><path d="M6 96 q3 -6 6 0 a3 3 0 1 1 -6 0Z"/><path d="M110 92 q3 -6 6 0 a3 3 0 1 1 -6 0Z"/><path d="M96 124 q3 -6 6 0 a3 3 0 1 1 -6 0Z"/></g>
