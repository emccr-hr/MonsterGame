      <rect x="51" y="40" width="7" height="4" rx="2" fill="#fff6c0" stroke="none" filter="url(#glow)"/>
      <rect x="62" y="40" width="7" height="4" rx="2" fill="#fff6c0" stroke="none" filter="url(#glow)"/>
